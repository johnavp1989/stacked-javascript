name: Upload to Google Storage
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  upload:
    name: Upload to Google Storage 📤

    # Add "id-token" with the intended permissions.
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest

    steps:
      # actions/checkout MUST come before auth
      - name: Checkout Repo 🛒
        uses: 'actions/checkout@v3'

      - name: Minify /home 🚐
        uses: nizarmah/auto-minify@v2.1
        with:
          directory: 'javascript/home'
          output: 'mini_javascript/home'
          overwrite: true

      - name: Minify /add-firewood 🚐
        uses: nizarmah/auto-minify@v2.1
        with:
          directory: 'javascript/add-firewood'
          output: 'mini_javascript/add-firewood'
          overwrite: true

      - name: Minify /log-in 🚐
        uses: nizarmah/auto-minify@v2.1
        with:
          directory: 'javascript/log-in'
          output: 'mini_javascript/log-in'
          overwrite: true

      - name: Minify /sign-up 🚐
        uses: nizarmah/auto-minify@v2.1
        with:
          directory: 'javascript/sign-up'
          output: 'mini_javascript/sign-up'
          overwrite: true

      - name: Minify /leaderboard 🚐
        uses: nizarmah/auto-minify@v2.1
        with:
          directory: 'javascript/leaderboard'
          output: 'mini_javascript/leaderboard'
          overwrite: true

      - name: Minify /global 🚐
        uses: nizarmah/auto-minify@v2.1
        with:
          directory: 'javascript/global'
          output: 'mini_javascript/global'
          overwrite: true

      - name: Set up Node 🟢
        uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build the maps 🗺️
        run: |
          npm ci
          npm run build
          # esbuild has already minified these, and the minify action cannot
          # parse its output, so they are built after the minify steps and
          # copied as they are. The minify action runs in Docker as root, so it
          # owns mini_javascript/.
          for built in home/map.js add-firewood/location-lookup-preview-map.js; do
            sudo mkdir -p "mini_javascript/$(dirname "$built")"
            sudo cp "javascript/$built" "mini_javascript/$built"
          done

      - name: Authenticate to Google Cloud 🔓
        uses: 'google-github-actions/auth@v0'
        with:
          workload_identity_provider: 'projects/940755218400/locations/global/workloadIdentityPools/github-actions/providers/github-actions'
          service_account: 'github-actions@stacked-327723.iam.gserviceaccount.com'

      - name: Upload Raw Javascript 📤
        uses: 'google-github-actions/upload-cloud-storage@v0'
        with:
          path: 'javascript'
          destination: 'stacked_javascript'
          headers: |-
            cache-control: max-age=1800, stale-if-error=86400

      - name: Upload Minified Javascript 📤
        uses: 'google-github-actions/upload-cloud-storage@v0'
        with:
          path: 'mini_javascript'
          destination: 'stacked_javascript'
          headers: |-
            cache-control: max-age=1800, stale-if-error=86400
